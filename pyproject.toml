[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exif-tagger"
version = "0.1.0"
description = "AI-powered image tagging tool that writes tags as XPTags EXIF metadata"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "Pillow>=10.0",
    "piexif>=1.1.3",
    "openai>=1.10",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
