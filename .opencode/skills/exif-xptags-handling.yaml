# Skill: EXIF/XPTags Handling (piexif + exiftool)
name: exif-xptags-handling  
description: >
  Läs och skriv XPTags-metadata i bilders EXIF-datat. Hanterar semikolon-separerade taggar,
  deduplicering, append-mode och fallback vid exiftool-otillgänglighet.

version: "1.0"
domain: exif_writer.py

---
# ──────────────────────────────────────────────────────────────────────────────
# CONTEXT (vilken kunskap behövs innan implementation)
# ──────────────────────────────────────────────────────────────────────────────
context_files:
  - src/exif_tagger/models/schema.py          # ImageCheckpoint, TagResult
  - specs/SPEC_TEMPLATE.md

---
# ──────────────────────────────────────────────────────────────────────────────
# TECHNICAL SPECIFICATIONS (must-follow during implementation)
# ──────────────────────────────────────────────────────────────────────────────
specifications:

  xptags_format: |
    XPTags är ett XMP-fält i EXIF-metadata. Lagras som semikolon-separerad sträng:
    
      landscape;portrait;architecture
    
    Specifikation för lagring:
      - Taggar ska vara lowercase (standardiserat)
      - Separeras med ";" (semikolon + ingen whitespace efter)  
      - Sorterade alfabetiskt vid skrivning
      - Dubletter filtreras bort innan skrivning
    
    Exempel på giltig sträng: "architecture;landscape;portrait"

  exiftool_integration: |
    Använd exiftool via subprocess för att läsa/skriva XPTags. Detta är den 
    ENDA tillförlitliga vägen då piexif saknar inbyggt stöd för XMP/XPTags.
    
    LÄSNING (get_existing_xptags):
      exiftool -s3 -XPTags <image_path>
      Returnerar sträng med semikolon-separerade taggar eller tom sträng
    
    SKRIVNING (write_xptags):  
      exiftool -XPTags="<new_tags>" <image_path>
      Skriver över hela XPTags-fältet – därför behöver vi först läsa och 
      merge:a befintliga taggar innan skrivning.

  append_mode_contract: |
    APPEND-LOGIK (kритisk funktion i systemet):
    
    1. Läs existerande XPTags från bilden
    2. Parsa till set[str] (lowercased)  
    3. Filtrera new_tags_to_add → håll bara de som INTE finns i existing
    4. Merge: merged = existing | {new_tag.lower() for new in truly_new}
    5. Sortera merged alfabetiskt, joina med ";"
    6. Skriv tillbaka med exiftool
    
    Om truly_new är tom → returnera (False, 0) OCH ANROPAD INTE exiftool!
    Detta sparar IO och undviker onödiga filändringar.

  deduplication_strategy: |
    - Befintliga taggar lagras som lowercase-set  
    - Nya taggar konverteras till lowercase innan jämförelse
    - Case-insensitive: "Landscape" matchar "landscape"
    - Sortering vid skrivning garanterar deterministisk output
    
    CRITICAL: Deduplicering sker INNE i write_xptags, INTE i main.py. 
    Detta gör modulen ren och testbar.

  graceful_degradation: |
    Om exiftool INTE finns tillgängligt (shutil.which("exiftool") returns None):
    
    - get_existing_xptags(): returnera tom set + logga debug
    - write_xptags(): returnera (False, 0) + logga warning  
    - tag_image_exif(): returnera (False, 0) + logga warning
    
    Systemet fortsätter att köra men utan EXIF-skrivning. 
    Användaren kan verifiera detta i loggen.

---
# ──────────────────────────────────────────────────────────────────────────────
# IMPLEMENTATION CHECKLIST (coder-agent verifierar mot detta)
# ──────────────────────────────────────────────────────────────────────────────
implementation_checklist:
  - "Importera subprocess på top-level (inte lokalt inne i funktioner)"
  - "_check_exiftool_available() använder shutil.which()"
  - "get_existing_xptags() returnerar tom set vid exiftool-fel/otillgänglighet"
  - "write_xptags() filtrerar bort befintliga taggar innan anrop till exiftool"
  - "När truly_new är tomt → returnera (False, 0) utan att anropa subprocess.run"
  - "_parse_existing_tags() hanterar whitespace runt taggar korrekt"
  - "tag_image_exif() är ett ren wrapper som delegater till write_xptags"

---
# ──────────────────────────────────────────────────────────────────────────────
# TESTING GUIDE (tester som verifierar korrekt implementation)
# ──────────────────────────────────────────────────────────────────────────────
testing_guide:
  mock_strategy: |
    Patcha subprocess.run på top-level av exif_writer-modulen:
    
    ```python
    @patch("exif_tagger.exif_writer.subprocess.run")
    def test_write_single_tag(mock_run):
        # Sätt upp side_effect för read-anrop + write-anrop
        mock_run.side_effect = [read_result, write_result]
        
        modified, count = write_xptags(path, ["landscape"])
        assert modified is True
        assert count == 1
    ```

  required_tests:
    - name: test_parse_existing_tags_empty_string  
      verify: returns empty set
    
    - name: test_parse_existing_tags_multiple_semicolon  
      verify: parses correctly and lowercases all tags
    
    - name: test_write_single_tag_calls_exiftool_once
      verify: subprocess.run called exactly once with correct XPTags argument
    
    - name: test_no_duplicate_writes_does_not_call_exiftool
      verify: when tag already exists, subprocess.run is NEVER called
      
    - name: test_append_mode_keeps_existing
      verify: second write preserves first write's tags
