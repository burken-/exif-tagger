# Skill: Pydantic Model Design (Configuration & Schema)
name: pydantic-model-design
description: >
  Design av pydantic-modeller för konfiguration, AI-respons och checkpoint-data.
  Hanterar aliasing, ConfigDict extra fields, validation och env-var-override.

version: "1.0"
domain: models/schema.py, config.py

---
# ──────────────────────────────────────────────────────────────────────────────
# CONTEXT (vilken kunskap behövs innan implementation)
# ──────────────────────────────────────────────────────────────────────────────
context_files:
  - src/exif_tagger/models/schema.py          # Nuvarande implementering
  - specs/SPEC_TEMPLATE.md

---
# ──────────────────────────────────────────────────────────────────────────────
# TECHNICAL SPECIFICATIONS (must-follow during implementation)
# ──────────────────────────────────────────────────────────────────────────────
specifications:

  model_design_principles: |
    Alla modeller följer dessa principer:
    
    1. USE Pydantic V2 syntax – INGA class Config: extra = "allow" (deprecated)
       - Istället: model_config = ConfigDict(extra='allow')
    
    2. Field constraints via ge/le/default i Field()-anropet, inte validatorer
    
    3. Aliasing för YAML-namn vs Python-attributnamn:
       - YAML: "model" → Python field: "ai_model" (undviker konflikt med pydantic V2:s 
         inbyggda model_config-attribut)
       - Field(alias="yaml_name") mappar YAML-nyckeln till fältet
    
    4. Extra fields允许 via ConfigDict – används för framtida extensibility:
       - Användare kan lägga till extra fält i config utan att koden bryter

  common_patterns:
    
    nested_model_with_alias: |
      # YAML har "model": {...} men Python-attributet heter ai_model
      class Config(BaseModel):
          ai_model: ModelConfig = Field(
              alias="model", 
              default_factory=ModelConfig
          )
          
          model_config = ConfigDict(extra='allow')  # V2 syntax!

    threshold_validation: |
      # Tröskelvärden (0-1) valideras via Field-constraints
      threshold: float = Field(
          default=0.7,
          ge=0.0, le=1.0,
          description="Confidence threshold for tag matching"
      )

    optional_fields_with_defaults: |
      # Sträng-fält med None som default (valfritt API-key)
      api_key: str | None = Field(
          default=None,
          description="API key. Can be set via env var OPENAI_API_KEY."
      )

  model_composition_rules: |
    STRUCTURERAD HIERARKI:
    
    - ModelConfig (konfiguration för vision-API:et)
    ├── base_url
    ├── model_name  
    ├── api_key (optional, kan override via env)
    ├── max_tokens
    └── temperature
    
    - TagDefinition (en enskild tagg)
    ├── description
    └── threshold
    
    - Config (top-level, innehåller ovanstående)
    ├── root_directory
    ├── ai_model: ModelConfig (alias "model")
    ├── tags: dict[str, TagDefinition]
    └── exclude_patterns: list[str]
    
    - ImageCheckpoint (status per bild under körning)
    ├── path
    ├── status ("done"|"pending"|"failed")
    ├── matched_tags: list[str]
    └── error: str | None
    
    - CheckpointData (fullständig checkpoint-state)
    ├── version, created_at, root_directory, total_images, processed
    └── images: dict[str, ImageCheckpoint]

---
# ──────────────────────────────────────────────────────────────────────────────
# IMPLEMENTATION CHECKLIST (coder-agent verifierar mot detta)
# ──────────────────────────────────────────────────────────────────────────────
implementation_checklist:
  - "Ingen klass med namnet 'Config' har nested class Config:" (skapar Pydantic V2-konflikt!)
  - "Alla ConfigDict-angivelser använder model_config = ConfigDict(extra='allow')"
  - "Field aliasing fungerar korrekt mellan YAML-namn och Python-attributnamn"
  - "Float-fält med trösklar har ge/le constraints (ge=0.0, le=1.0)"
  - "Optional strängar använder str | None-typ, inte str = ''"

---
# ──────────────────────────────────────────────────────────────────────────────
# TESTING GUIDE (tester som verifierar korrekt implementation)
# ──────────────────────────────────────────────────────────────────────────────
testing_guide:
  required_tests:
    - name: test_model_config_defaults
      verify: default values match Field() specifications
    
    - name: test_invalid_temperature_rejected  
      verify: temperature > 2.0 raises ValidationError
    
    - name: test_env_override_changes_config_value
      verify: EXIFTAGGER_MODEL_BASE_URL changes config.ai_model.base_url
