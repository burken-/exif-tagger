# Skill: Image Processing Pipeline (Pillow + Format Support)
name: image-processing-pipeline
description: >
  Bildupptäckt, formatfiltrering, konvertering till base64 och resize-strategier 
  för vision-modellanrop. Hanterar JPG, PNG, TIFF, WebP, HEIC/HEIF.

version: "1.0"
domain: image_scanner.py, ai_client.py (image_to_base64-funktionen)

---
# ──────────────────────────────────────────────────────────────────────────────
# CONTEXT (vilken kunskap behövs innan implementation)
# ──────────────────────────────────────────────────────────────────────────────
context_files:
  - src/exif_tagger/models/schema.py          # IMAGE_EXTENSIONS-konstanten
  - specs/SPEC_TEMPLATE.md

---
# ──────────────────────────────────────────────────────────────────────────────
# TECHNICAL SPECIFICATIONS (must-follow during implementation)
# ──────────────────────────────────────────────────────────────────────────────
specifications:

  supported_image_extensions: |
    Filtrering baseras på filändelse, inte MIME-typ. Stödda format:
    
      .jpg, .jpeg     – JPEG (vanligast i bildarkiv)
      .png            – PNG (transparenta bilder, skärmdumpar)
      .tif, .tiff     – TIFF (professionella fotografier, arkivering)  
      .webp           – WebP (modernt web-format)
      .heic, .heif    – HEIC/HEIF (iOS/macOS originalbilder)
    
    IMPLEMENTERING:
      IMAGE_EXTENSIONS = frozenset({".jpg", ".jpeg", ".png", ...})
      
      def _is_image_path(path: Path) -> bool:
          return path.suffix.lower() in IMAGE_EXTENSIONS
    
    CRITICAL: Använd .suffix (inte filename[-4:]) för att undvika missbedömning 
    av filer som "image.jpg.bak" eller "archive.tar.gz".

  recursive_scanning_contract: |
    Rekursiv sökning ska vara DETERMINISTISK – samma bilder i samma ordning varje gång.
    
    IMPLEMENTERING (image_scanner.scan_images):
      1. Resolv root_directory till absolut sökväg (Path.resolve())
      2. Iterera genom alla kataloger rekursivt med Path.walk()  
      3. Sortera DIRNAME i walk-loopen för deterministisk traversal-ordning
      4. För varje fil: kontrollera extension + exclude-mönster
      5. SORTERA slutresultatet alfabetiskt (fullständig sökväg)
    
    EXCLUDE-PATTERN LOGIK:
      - Mönstret appliceras på relativ sökväg från root_directory (posix-format)
      - Använd re.compile(pattern).search(rel_path_posix)  
      - Exempel: pattern "/\\." matchar ".hidden_dir/photo.jpg" men INTE ".hidden.jpg" 
        (eftersom det kräver "/" före punkten i sökvägen)
    
    BEST PRACTICE:
      - Skapa en _build_exclude_compilers(patterns)-funktion som kompilera regex-er
        EN gång och återanvänder dem för alla filer.

  image_to_base64_contract: |
    Konvertera lokal bild till base64-encoded JPEG för vision-modellanrop.
    
    IMPLEMENTERING (ai_client._image_to_base64):
      1. Öppna med PIL.Image.open(path)
      2. Konvertera till RGB-mode om necessary:
         - RGBA, LA → convert("RGB")  
         - P (palette) → convert("RGB")
         - annars → behåll som är
    
    3. Resize OM max dimension > MAX_IMAGE_DIMENSION (1024):
       - Beräkna ratio baserat på längsta sidan
       - Använd Image.LANCZOS för högkvalitativ resize
    
    4. Spara till BytesIO-buffer med JPEG-format, quality=85:
       buffer = io.BytesIO()
       img.save(buffer, format="JPEG", quality=85)
    
    5. Encode base64 och returnera sträng
    
    CRITICAL: 
      - Använd PIL:s internal I/O (io.BytesIO) istället för temporära filer  
      - JPEG-quality 85 ger bra balans mellan filstorlek och AI-analyskvalitet
      - MAX_IMAGE_DIMENSION = 1024 håller payload under ~500KB per bild

---
# ──────────────────────────────────────────────────────────────────────────────
# IMPLEMENTATION CHECKLIST (coder-agent verifierar mot detta)
# ──────────────────────────────────────────────────────────────────────────────
implementation_checklist:
  - "IMAGE_EXTENSIONS är en frozenset för O(1)-lookup"
  - "_is_image_path() använder .suffix.lower() för jämförelse"  
  - "scan_images() sorterar walk-loopens dirnames för deterministisk traversal"
  - "Excluded paths matchas mot relativ sökväg (posix-format)"
  - "_image_to_base64() konverterer RGBA/P/CMYK till RGB före JPEG-sparande"
  - "Resize använder LANCZOS-filter och behåller bildens aspect ratio"

---
# ──────────────────────────────────────────────────────────────────────────────
# TESTING GUIDE (tester som verifierar korrekt implementation)
# ──────────────────────────────────────────────────────────────────────────────
testing_guide:
  required_tests:
    - name: test_scan_finds_jpg_and_png  
      verify: scan_images returns all .jpg and .png files in directory
    
    - name: test_exclude_hidden_files
      verify: exclude pattern "^\\." filters out dotfiles
    
    - name: test_deterministic_order
      verify: returned paths are sorted alphabetically
    
    - name: test_nonexistent_directory_raises  
      verify: FileNotFoundError raised for missing root_directory
