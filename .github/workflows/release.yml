name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'pyproject.toml'
  tags:
    - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    
    # Version bumping only happens on main branch pushes (not tags or manual dispatch)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.before, '0000')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_BUMP_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install GitHub CLI for GHCR API access
        run: |
          sudo apt-get update && sudo apt-get install -y gh
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read current version from pyproject.toml
        id: read_version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "current=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Determine bump type from commit messages
        id: bump_type
        run: |
          COMMITS=$(git log --format=%s "${{ steps.read_version.outputs.current }}..HEAD" 2>/dev/null || git log --format=%s HEAD~50..)

          if echo "$COMMITS" | grep -qE '^feat:'; then
            BUMP="minor"
          elif echo "$COMMITS" | grep -qE '^fix:'; then
            BUMP="patch"
          else
            BUMP=""
          fi

          # Also check for feat/fix in any commit if the tag range produced nothing
          if [ -z "$BUMP" ]; then
            COMMITS=$(git log --format=%s HEAD~50..)
            if echo "$COMMITS" | grep -qE '^\s*(feat|fix):'; then
              if echo "$COMMITS" | grep -qE '^\s*feat:'; then
                BUMP="minor"
              elif echo "$COMMITS" | grep -qE '^\s*fix:'; then
                BUMP="patch"
              fi
            fi
          fi

          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          if [ -n "$BUMP" ]; then
            echo "Will bump: $BUMP (found relevant commit messages)"
          else
            echo "No version bump needed"
          fi

      - name: Bump and update pyproject.toml
        id: new_version
        run: |
          CURRENT="${{ steps.read_version.outputs.current }}"
          BUMP="${{ steps.bump_type.outputs.bump }}"

          if [ -z "$BUMP" ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Strip pre-release suffix for arithmetic (e.g., "0.1.0-beta.1" -> "0.1.0")
          BASE_VERSION=$(echo "$CURRENT" | sed 's/-.*//')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"

          case "$BUMP" in
            minor)
              NEW_VERSION="$MAJOR.$((MINOR + 1)).0"
              ;;
            patch)
              NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
              ;;
          esac

          # Update pyproject.toml version line-by-line (targets only `version =` lines)
          python3 scripts/bump_version.py "$NEW_VERSION"

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Version updated to $NEW_VERSION"

      - name: Check if tag already exists
        id: check_tag
        run: |
          TAG="v${{ steps.new_version.outputs.version }}"
          REMOTE_TAG=$(git ls-remote --tags origin "refs/tags/$TAG" 2>/dev/null || true)
          if [ -n "$REMOTE_TAG" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Tag $TAG already exists remotely. Skipping push."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push version change
        if: steps.new_version.outputs.skipped == 'false' && steps.new_version.outputs.version != '' && steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "release-bot"
          git config user.email "release-bot@github.com"

          NEW_VERSION="${{ steps.new_version.outputs.version }}"

          # Check for uncommitted changes (the version bump)
          if ! git diff --quiet; then
            git add pyproject.toml
            git commit -m "chore: bump version to $NEW_VERSION [skip ci]" || echo "No changes to commit"
            git push origin main

            # Create and push tag for the new version
            TAG="v$NEW_VERSION"
            if ! git rev-parse "$TAG" >/dev/null 2>&1; then
              git tag -a "$TAG" -m "Release $TAG" || echo "Tag may already exist locally, proceeding with push attempt"
              git push origin "$TAG" || true
            fi

            # If the tag wasn't created (already existed), still try to force-push it
            TAG="v${{ steps.new_version.outputs.version }}"
            if ! git rev-parse HEAD^{tag} 2>/dev/null | grep -q "Release $TAG"; then
              git push origin "$TAG" --force || true
            fi

            echo "Pushed version bump and tag v${{ steps.new_version.outputs.version }} to main"
          else
            echo "No changes detected after version update, skipping commit/push"
          fi

  docker-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: [version-bump]
    # Only run on tagged releases or main branch pushes
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from pyproject.toml
        id: get_version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry via OIDC token exchange
        run: |
          # Use GitHub Actions' built-in GITHUB_TOKEN (OIDC-backed) for GHCR authentication.
          # The workflow-level permissions: packages: write enables this token's scope,
          # allowing docker login without needing a separate PAT or secrets.GHCR_USERNAME.
          echo "${{ github.token }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Determine image visibility and tags
        id: meta_tags
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          
          # Check if this is a tagged release or branch build
          if [[ "${GITHUB_REF}" =~ ^refs/tags/v ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            
            # Check if this is a stable release (no pre-release suffix like alpha, beta, rc)
            if [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              VISIBILITY="public"
              echo "Stable tag detected: $VERSION - will push with latest tag"
              
              # For stable releases: use version tag + latest (replace any existing)
              TAGS="ghcr.io/${{ github.repository }}:${TAG_NAME},ghcr.io/${{ github.repository }}:latest,ghcr.io/${{ github.repository }}:$VERSION"
            else
              VISIBILITY="private"
              echo "Beta/RC release detected: $VERSION - will push with version tag only"
              
              # For beta releases: use the full tag name (e.g., v1.0.0-beta.1) and version without 'v' prefix
              TAGS="ghcr.io/${{ github.repository }}:${TAG_NAME},ghcr.io/${{ github.repository }}:$VERSION,beta,latest"
            fi
          else
            # Branch build from main - this is a beta/pre-release image
            VISIBILITY="private"
            
            # Use commit SHA for unique identification + 'beta' tag
            COMMIT_SHA="${{ github.sha }}"
            SHORT_SHA=$(echo "$COMMIT_SHA" | cut -c1-7)
            
            echo "Main branch build detected: $VERSION (commit ${SHORT_SHA}) - will push with beta tags"
            
            # Beta image tagged as 'beta' and replaces latest for main branch builds
            TAGS="ghcr.io/${{ github.repository }}:${COMMIT_SHA},ghcr.io/${{ github.repository }}:$VERSION,beta,latest"
          fi

          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "visibility=$VISIBILITY" >> "$GITHUB_OUTPUT"

      - name: Set image visibility (private for beta images)
        run: |
          if [[ "${{ steps.meta_tags.outputs.visibility }}" == "private" ]]; then
            # Mark package as private via GHCR API or GitHub CLI
            gh api /packages/container/exif-tagger/visibility \
              -f visibility="private" \
              --accept=application/vnd.github.v3+json || true
            
            echo "Image marked as private (beta release)"
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=exif-tagger
            org.opencontainers.image.description=AI-powered image tagging tool that writes tags as XPTags EXIF metadata (beta) if pre-release version.
            org.opencontainers.image.version=${{ steps.get_version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Set release notes for beta images
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            # Create/update GitHub Release for pre-release tag (beta/alpha/rc)
            gh release create "v$VERSION" \
              --title="Beta Release v${VERSION}" \
              --notes="🚧 **Pre-release Build**

Version: $VERSION
Commit: ${{ github.sha }}
Build Date: $(date -u +'%Y-%m-%d %H:%M:%S UTC')

This is a beta/pre-release image. Use at your own risk." \
              --prerelease || echo "Release creation skipped"
          fi
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'

      - name: Save Docker image as artifact
        run: |
          docker save ${{ steps.meta_tags.outputs.tags }} -o /tmp/exif-tagger.tar
        if: always()

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ steps.get_version.outputs.version }}
          path: /tmp/exif-tagger.tar
          retention-days: 7
        if: always()
