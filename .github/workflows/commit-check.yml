name: Commit Convention Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

jobs:
  conventional-commits:
    name: Validate Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine PR range or full history for validation
        id: refs
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
            echo "head=HEAD" >> "$GITHUB_OUTPUT"
          else
            # For pushes to main, find the last [skip ci] commit or validate up to 50 commits back
            if [ "${{ github.event_name }}" = "push" ]; then
              LAST_SKIP=$(git log --oneline -50 | grep '\[skip ci\]' | head -1)
              if [ -n "$LAST_SKIP" ]; then
                BASE_COMMIT="${LAST_SKIP%% *}~1"
              else
                BASE_COMMIT="HEAD~50..HEAD"
              fi
            else
              BASE_COMMIT="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
            fi
            echo "base=$BASE_COMMIT" >> "$GITHUB_OUTPUT"
            echo "head=HEAD" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate commits against Conventional Commits format
        run: |
          python scripts/validate_commits.py \
            "${{ steps.refs.outputs.base }}" \
            "${{ steps.refs.outputs.head }}" \
            --allow-merge-commits
