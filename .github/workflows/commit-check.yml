name: Commit Convention Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

jobs:
  conventional-commits:
    name: Validate Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Determine PR range or full history for validation
        id: refs
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Use SHAs directly since PR checkouts use detached HEAD and branch names may not resolve
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            if [ "${{ github.event_name }}" = "push" ]; then
              # Find the last [skip ci] commit or validate up to 50 commits back dynamically
              LAST_SKIP=$(git log --oneline --no-merges | grep '\[skip ci\]' | head -1 || true)
              if [ -n "$LAST_SKIP" ]; then
                BASE_COMMIT="${LAST_SKIP%% *}~1"
              else
                # Dynamic fallback: use root commit if fewer than 50 exist, otherwise the 50th commit from HEAD
                COMMIT_COUNT=$(git rev-list --count HEAD || echo "0")
                if [ "$COMMIT_COUNT" -gt 50 ]; then
                  BASE_COMMIT=$(git rev-list HEAD | sed -n '51p')
                  if [ -z "$BASE_COMMIT" ]; then
                    BASE_COMMIT="$(git rev-list --max-parents=0 HEAD | tail -n1)"
                  fi
                else
                  BASE_COMMIT="$(git rev-list --max-parents=0 HEAD | tail -n1)"
                fi
              fi

              # Resolve any remaining relative refs to absolute SHAs for reliable git log usage
              if echo "$BASE_COMMIT" | grep -q '~'; then
                RESOLVED=$(git rev-parse "${BASE_COMMIT}" 2>/dev/null || true)
                if [ -n "$RESOLVED" ]; then
                  BASE_COMMIT="$RESOLVED"
                else
                  # Shallow clone fallback: strip the ~N suffix and use the bare SHA
                  BASE_COMMIT="${BASE_COMMIT%%~*}"
                fi
              fi
            else
              BASE_COMMIT="${{ github.event.pull_request.base.sha }}"
            fi
            echo "base=$BASE_COMMIT" >> "$GITHUB_OUTPUT"
            echo "head=HEAD" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate commits against Conventional Commits format
        run: |
          python scripts/validate_commits.py \
            "${{ steps.refs.outputs.base }}" \
            "${{ steps.refs.outputs.head }}" \
            --allow-merge-commits
